name: Frontend CI/CD (hky customer environment)

on:
  push:
    branches:
      - hky
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/shenzhuangzhi1/skit-saas-frontend
  IMAGE_TAG: hky-${{ github.sha }}
  RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  test-and-build:
    name: Frontend tests and build (hky)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify callback log safety
        run: |
          bash deploy/test-callback-log-safety.sh
          ./deploy/test-release-security.sh

      - name: Run product tests
        run: |
          pnpm test:unit
          node --test test/*.test.mjs

      - name: Verify types and production lint
        run: |
          pnpm ts:check
          pnpm lint

      - name: Build production assets
        env:
          VITE_BASE_URL: ''
          VITE_API_URL: /admin-api
        run: |
          pnpm build:prod
          pnpm verify:product-build

      - name: Login to GHCR
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          set -euo pipefail
          docker buildx build \
            --label app=skit-saas-frontend \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            -f deploy/Dockerfile \
            -t "${IMAGE_NAME}:${IMAGE_TAG}" \
            --load \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            .

      - name: Push image to GHCR
        run: |
          set -euo pipefail
          docker push "${IMAGE_NAME}:${IMAGE_TAG}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect customer deployment secrets
        id: deploy_config
        env:
          CUSTOMER_SERVER_HOST: ${{ secrets.CUSTOMER_SERVER_HOST }}
          CUSTOMER_SERVER_USER: ${{ secrets.CUSTOMER_SERVER_USER }}
          CUSTOMER_SERVER_PASSWORD: ${{ secrets.CUSTOMER_SERVER_PASSWORD }}
        run: |
          if [ -n "${CUSTOMER_SERVER_HOST}" ] && [ -n "${CUSTOMER_SERVER_USER}" ] && [ -n "${CUSTOMER_SERVER_PASSWORD}" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::Customer deployment skipped: set CUSTOMER_SERVER_HOST/USER/PASSWORD secrets."
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Prepare SSH tooling
        if: steps.deploy_config.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          mkdir -p .deploy
          cat > .deploy/ssh << 'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          SSHPASS="${SKIT_SSH_PASSWORD}" sshpass -e ssh -o PreferredAuthentications=password,keyboard-interactive \
            -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "${SERVER_PORT:-22}" "$@"
          EOF
          cat > .deploy/scp << 'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          SSHPASS="${SKIT_SSH_PASSWORD}" sshpass -e scp -o PreferredAuthentications=password,keyboard-interactive \
            -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -P "${SERVER_PORT:-22}" "$@"
          EOF
          chmod +x .deploy/ssh .deploy/scp

      - name: Upload release bundle to customer server
        if: steps.deploy_config.outputs.enabled == 'true'
        env:
          CUSTOMER_SERVER_HOST: ${{ secrets.CUSTOMER_SERVER_HOST }}
          CUSTOMER_SERVER_USER: ${{ secrets.CUSTOMER_SERVER_USER }}
          CUSTOMER_SERVER_PASSWORD: ${{ secrets.CUSTOMER_SERVER_PASSWORD }}
          CUSTOMER_SERVER_PORT: ${{ secrets.CUSTOMER_SERVER_PORT }}
          CUSTOMER_SERVER_ENV_BASE64: ${{ secrets.CUSTOMER_SERVER_ENV_BASE64 }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIT_SSH_PASSWORD: ${{ secrets.CUSTOMER_SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          : "${CUSTOMER_SERVER_USER:?Set CUSTOMER_SERVER_USER secret}"
          SERVER_PORT="${CUSTOMER_SERVER_PORT:-22}"
          SSH_TARGET="${CUSTOMER_SERVER_USER}@${CUSTOMER_SERVER_HOST}"
          DEPLOY_PATH="skit-saas"
          RELEASE_BUNDLE_PATH="${DEPLOY_PATH}/releases/frontend-${RELEASE_ID}"
          .deploy/ssh "${SSH_TARGET}" \
            "mkdir -p '${DEPLOY_PATH}/releases' && mkdir -- '${RELEASE_BUNDLE_PATH}'"
          .deploy/scp deploy/activate-frontend.sh deploy/cleanup-frontend-release-env.sh \
            deploy/nginx.conf "${SSH_TARGET}:${RELEASE_BUNDLE_PATH}/"
          if [ -n "${CUSTOMER_SERVER_ENV_BASE64}" ]; then
            {
              echo "GHCR_USERNAME=${GITHUB_ACTOR}"
              echo "GHCR_TOKEN=${GITHUB_TOKEN}"
              echo "${CUSTOMER_SERVER_ENV_BASE64}" | base64 -d
            } > server.env
            .deploy/scp server.env "${SSH_TARGET}:${RELEASE_BUNDLE_PATH}/server.env"
          else
            echo "::error::Set CUSTOMER_SERVER_ENV_BASE64 (customer server.env, base64) to deploy."
            exit 1
          fi
          echo "bundle uploaded to ${SSH_TARGET}:${RELEASE_BUNDLE_PATH}"

      - name: Transfer frontend image to customer server
        if: steps.deploy_config.outputs.enabled == 'true'
        env:
          CUSTOMER_SERVER_HOST: ${{ secrets.CUSTOMER_SERVER_HOST }}
          CUSTOMER_SERVER_USER: ${{ secrets.CUSTOMER_SERVER_USER }}
          CUSTOMER_SERVER_PASSWORD: ${{ secrets.CUSTOMER_SERVER_PASSWORD }}
          CUSTOMER_SERVER_PORT: ${{ secrets.CUSTOMER_SERVER_PORT }}
          SKIT_SSH_PASSWORD: ${{ secrets.CUSTOMER_SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          SERVER_PORT="${CUSTOMER_SERVER_PORT:-22}"
          SSH_TARGET="${CUSTOMER_SERVER_USER}@${CUSTOMER_SERVER_HOST}"
          echo "Streaming ${IMAGE_NAME}:${IMAGE_TAG} to ${SSH_TARGET} via docker save (bypasses slow ghcr.io pulls from China)."
          docker save "${IMAGE_NAME}:${IMAGE_TAG}" | .deploy/ssh "${SSH_TARGET}" "docker load"
          .deploy/ssh "${SSH_TARGET}" "docker image inspect '${IMAGE_NAME}:${IMAGE_TAG}' >/dev/null 2>&1 && echo image-present || echo image-missing"

      - name: Activate frontend on customer server
        if: steps.deploy_config.outputs.enabled == 'true'
        env:
          CUSTOMER_SERVER_HOST: ${{ secrets.CUSTOMER_SERVER_HOST }}
          CUSTOMER_SERVER_USER: ${{ secrets.CUSTOMER_SERVER_USER }}
          CUSTOMER_SERVER_PASSWORD: ${{ secrets.CUSTOMER_SERVER_PASSWORD }}
          CUSTOMER_SERVER_PORT: ${{ secrets.CUSTOMER_SERVER_PORT }}
          SKIT_SSH_PASSWORD: ${{ secrets.CUSTOMER_SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          SERVER_PORT="${CUSTOMER_SERVER_PORT:-22}"
          SSH_TARGET="${CUSTOMER_SERVER_USER}@${CUSTOMER_SERVER_HOST}"
          DEPLOY_PATH="skit-saas"
          RELEASE_BUNDLE_PATH="${DEPLOY_PATH}/releases/frontend-${RELEASE_ID}"
          .deploy/ssh "${SSH_TARGET}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' \
             RELEASE_BUNDLE_PATH='releases/frontend-${RELEASE_ID}' \
             IMAGE_NAME='${IMAGE_NAME}' IMAGE_TAG='${IMAGE_TAG}' \
             bash '${RELEASE_BUNDLE_PATH}/activate-frontend.sh'"
